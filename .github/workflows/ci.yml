name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# SAFETY Least privilege for the automatic token, nothing here needs write access
permissions:
  contents: read

# PERF Cancel superseded runs on the same branch instead of queueing them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make fmt-check
      - run: make vet
      - run: make build
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # NOTE Installed the same way as locally, so both use one version
      - run: make tools
      - run: make lint
